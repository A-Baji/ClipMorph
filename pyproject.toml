[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipmorph"
version = "0.5.0"
dynamic = ["dependencies"]
authors = [
    { name = "A-Baji" }
]
description = "A tool for converting and uploading short-form content to multiple platforms"
readme = "README.md"
requires-python = ">=3.11.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "httpx2>=2.13.1",
]
dev = [
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "coverage>=7.16.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["clipmorph*"]

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[tool.setuptools.package-data]
clipmorph = [
    "ffmpeg/linux/*",
    "ffmpeg/mac/*",
    "ffmpeg/windows/*",
    "resources/fonts/roboto/*",
    "web_assets/**/*"
]

[project.scripts]
clipmorph = "clipmorph.__main__:main"
clipmorph-ui = "clipmorph.ui_launcher:main"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Start non-breaking while existing code is brought forward; broaden later.
select = ["E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["clipmorph"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["clipmorph"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]