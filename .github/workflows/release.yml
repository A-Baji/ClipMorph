name: Build and Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix (for example, 0.1.0)'
        required: true
        type: string
      allow_existing_tag:
        description: 'Reuse an existing tag when rerunning a failed release'
        required: false
        default: false
        type: boolean

jobs:
  release:
    name: Prepare release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
        token: ${{ secrets.PAT_TOKEN }}

    - name: Validate version
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Version must be in format X.Y.Z (e.g., 0.1.1)"
          exit 1
        fi

    - name: Create or reuse release tag
      id: release
      env:
        VERSION: ${{ inputs.version }}
        ALLOW_EXISTING: ${{ inputs.allow_existing_tag }}
      run: |
        TAG="v$VERSION"
        git fetch origin --tags

        if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
          if [ "$ALLOW_EXISTING" != "true" ]; then
            echo "Tag $TAG already exists; set allow_existing_tag=true to reuse it."
            exit 1
          fi
          COMMIT_SHA=$(git rev-list -n 1 "refs/tags/$TAG")
        else
          printf '__version__ = "%s"\n' "$VERSION" > clipmorph/__version__.py
          git add clipmorph/__version__.py
          if ! git diff --staged --quiet; then
            echo "Version is not present on main. Prepare the version through a PR before dispatching release."
            exit 1
          fi
          COMMIT_SHA=$(git rev-parse HEAD)
        fi

        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build on ${{ matrix.os }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        variant: [cli, ui]
        os: [windows-latest, macos-latest, ubuntu-24.04]
        include:
          # CLI variant: no web dependencies, no frontend assets, no browser launch code.
          - os: windows-latest
            variant: cli
            output_name: clipmorph.exe
            asset_name: clipmorph-cli-windows.zip
            ffmpeg_dir: windows
            entry_script: clipmorph/__main__.py
            pip_extra: ""
          - os: macos-latest
            variant: cli
            output_name: clipmorph
            asset_name: clipmorph-cli-macos.zip
            ffmpeg_dir: mac
            entry_script: clipmorph/__main__.py
            pip_extra: ""
          - os: ubuntu-24.04
            variant: cli
            output_name: clipmorph
            asset_name: clipmorph-cli-linux
            ffmpeg_dir: linux
            entry_script: clipmorph/__main__.py
            pip_extra: ""
          # UI variant: bundles FastAPI/Uvicorn, built Svelte assets, and the desktop launcher.
          - os: windows-latest
            variant: ui
            output_name: clipmorph-ui.exe
            asset_name: clipmorph-ui-windows.zip
            ffmpeg_dir: windows
            entry_script: clipmorph/ui_launcher.py
            pip_extra: "[web]"
          - os: macos-latest
            variant: ui
            output_name: clipmorph-ui
            asset_name: clipmorph-ui-macos.zip
            ffmpeg_dir: mac
            entry_script: clipmorph/ui_launcher.py
            pip_extra: "[web]"
          - os: ubuntu-24.04
            variant: ui
            output_name: clipmorph-ui
            asset_name: clipmorph-ui-linux
            ffmpeg_dir: linux
            entry_script: clipmorph/ui_launcher.py
            pip_extra: "[web]"

    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.release.outputs.commit_sha }}
        lfs: true
    
    - name: Checkout LFS objects
      run: git lfs pull
    
    - name: Free up disk space (Linux only)
      if: runner.os == 'Linux'
      run: |
        echo "=== Before cleanup ==="
        df -h
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo apt-get clean
        docker system prune -af
        echo "=== After cleanup ==="
        df -h
      shell: bash
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install CPU-only PyTorch on Linux
      if: runner.os == 'Linux'
      run: |
        python -m pip install --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cpu
        python - <<'PY'
        from importlib.metadata import version

        with open("torch-constraints.txt", "w", encoding="utf-8") as constraints:
            constraints.write(f"torch=={version('torch')}\n")
            constraints.write(f"torchaudio=={version('torchaudio')}\n")
        PY

    - name: Set execute permissions for FFmpeg binaries (Unix only)
      if: runner.os != 'Windows'
      run: |
        if [ "$RUNNER_OS" == "macOS" ]; then
          chmod +x clipmorph/ffmpeg/mac/ffmpeg
          chmod +x clipmorph/ffmpeg/mac/ffprobe
          echo "Set permissions for macOS binaries"
        elif [ "$RUNNER_OS" == "Linux" ]; then
          chmod +x clipmorph/ffmpeg/linux/ffmpeg
          chmod +x clipmorph/ffmpeg/linux/ffprobe
          echo "Set permissions for Linux binaries"
        fi
      shell: bash

    - name: Remove unnecessary FFmpeg binaries to save space
      run: |
        if [ "$RUNNER_OS" == "macOS" ]; then
          rm -rf clipmorph/ffmpeg/windows clipmorph/ffmpeg/linux
          echo "Removed Windows and Linux FFmpeg binaries"
        elif [ "$RUNNER_OS" == "Linux" ]; then
          rm -rf clipmorph/ffmpeg/windows clipmorph/ffmpeg/mac
          echo "Removed Windows and macOS FFmpeg binaries"
        elif [ "$RUNNER_OS" == "Windows" ]; then
          rm -rf clipmorph/ffmpeg/mac clipmorph/ffmpeg/linux
          echo "Removed macOS and Linux FFmpeg binaries"
        fi
      shell: bash

    - name: Verify FFmpeg binaries
      run: |
        if [ "$RUNNER_OS" == "macOS" ]; then
          ls -lh clipmorph/ffmpeg/mac/
          ./clipmorph/ffmpeg/mac/ffmpeg -version
        elif [ "$RUNNER_OS" == "Linux" ]; then
          ls -lh clipmorph/ffmpeg/linux/
          ./clipmorph/ffmpeg/linux/ffmpeg -version
        elif [ "$RUNNER_OS" == "Windows" ]; then
          ls clipmorph/ffmpeg/windows/
          ./clipmorph/ffmpeg/windows/ffmpeg.exe -version
        fi
      shell: bash
        
    - name: Set up Node.js (UI variant only, build tooling not part of the distributed artifact)
      if: matrix.variant == 'ui'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build frontend assets (UI variant only)
      if: matrix.variant == 'ui'
      working-directory: frontend
      run: npm install --no-audit --no-fund && npm run build

    - name: Verify built frontend assets exist (UI variant only)
      if: matrix.variant == 'ui'
      run: test -f clipmorph/web_assets/index.html
      shell: bash

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip --no-cache-dir
        pip install pyinstaller --no-cache-dir
        if [ "$RUNNER_OS" == "Linux" ]; then
          pip install ".${{ matrix.pip_extra }}" --no-cache-dir --constraint torch-constraints.txt
          rm torch-constraints.txt
        else
          pip install ".${{ matrix.pip_extra }}" --no-cache-dir
        fi
      shell: bash

    - name: Verify CPU-only PyTorch on Linux
      if: runner.os == 'Linux'
      run: |
        python -c "import torch; print(f'Torch {torch.__version__}, CUDA runtime: {torch.version.cuda}'); assert torch.version.cuda is None, 'CUDA-enabled Torch was installed'"

    - name: Create PyInstaller Spec
      run: |
        EXTRA_DATA=""
        if [ "${{ matrix.variant }}" == "ui" ]; then
          EXTRA_DATA="('clipmorph/web_assets', 'clipmorph/web_assets'),"
        fi
        if [ "$RUNNER_OS" == "Windows" ] || [ "$RUNNER_OS" == "macOS" ]; then
          # Directory-based build avoids extracting the full ML runtime on every launch.
          cat > clipmorph.spec << EOF
        # -*- mode: python ; coding: utf-8 -*-

        import sys

        excludes = [
            'pytest', 'unittest', 'nose', 'hypothesis',
            'sphinx', 'docutils', 'IPython', 'jupyter',
            'tkinter', 'PyQt5', 'PyQt6', 'PySide2', 'PySide6',
            'tensorflow', 'tensorboard', 'jax', 'flax',
            'scipy.spatial', 'scipy.ndimage', 'scipy.signal.windows',
            'matplotlib.backends.backend_qt5agg',
            'matplotlib.backends.backend_tkagg',
            'matplotlib.backends.backend_wxagg',
            'sympy', 'bokeh', 'dask', 'distributed',
            # NOTE: keep 'setuptools' out of this list. Excluding it drops the
            # vendored pkg_resources/jaraco modules some transitive deps import
            # at runtime, which crashes frozen builds with a jaraco ImportError.
            'pip', 'distutils',
        ]

        a = Analysis(
            ['${{ matrix.entry_script }}'],
            pathex=[],
            binaries=[],
            datas=[
                ('clipmorph/ffmpeg/${{ matrix.ffmpeg_dir }}', 'clipmorph/ffmpeg/${{ matrix.ffmpeg_dir }}'),
                ('clipmorph/resources', 'clipmorph/resources'),
                $EXTRA_DATA
            ],
            hiddenimports=['dotenv', 'whisper', 'whisperx', 'torch', 'torchaudio'],
            hookspath=[],
            hooksconfig={'matplotlib': {'backends': ['Agg']}},
            runtime_hooks=[],
            excludes=excludes,
            noarchive=False,
        )
        
        seen = set()
        filtered_binaries = []
        for binary in a.binaries:
            if binary[0] not in seen:
                seen.add(binary[0])
                filtered_binaries.append(binary)
        a.binaries = filtered_binaries
        
        pyz = PYZ(a.pure)
        exe = EXE(
            pyz,
            a.scripts,
            [],
            exclude_binaries=True,
            name='${{ matrix.output_name }}',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=False,
            console=True,
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
        )
        coll = COLLECT(
            exe,
            a.binaries,
            a.datas,
            strip=False,
            upx=False,
            upx_exclude=[],
            name='clipmorph',
        )
        EOF
        else
          # Directory-based build for Linux
          cat > clipmorph.spec << EOF
        # -*- mode: python ; coding: utf-8 -*-

        import sys

        excludes = [
            'pytest', 'unittest', 'nose', 'hypothesis',
            'sphinx', 'docutils', 'IPython', 'jupyter',
            'tkinter', 'PyQt5', 'PyQt6', 'PySide2', 'PySide6',
            'tensorflow', 'tensorboard', 'jax', 'flax',
            'scipy.spatial', 'scipy.ndimage', 'scipy.signal.windows',
            'matplotlib.backends.backend_qt5agg',
            'matplotlib.backends.backend_tkagg',
            'matplotlib.backends.backend_wxagg',
            'sympy', 'bokeh', 'dask', 'distributed',
            # NOTE: keep 'setuptools' out of this list. Excluding it drops the
            # vendored pkg_resources/jaraco modules some transitive deps import
            # at runtime, which crashes frozen builds with a jaraco ImportError.
            'pip', 'distutils',
        ]

        a = Analysis(
            ['${{ matrix.entry_script }}'],
            pathex=[],
            binaries=[],
            datas=[
                ('clipmorph/ffmpeg/${{ matrix.ffmpeg_dir }}', 'clipmorph/ffmpeg/${{ matrix.ffmpeg_dir }}'),
                ('clipmorph/resources', 'clipmorph/resources'),
                $EXTRA_DATA
            ],
            hiddenimports=['dotenv', 'whisper', 'whisperx', 'torch', 'torchaudio'],
            hookspath=[],
            hooksconfig={'matplotlib': {'backends': ['Agg']}},
            runtime_hooks=[],
            excludes=excludes,
            noarchive=False,
        )
        
        seen = set()
        filtered_binaries = []
        for binary in a.binaries:
            if binary[0] not in seen:
                seen.add(binary[0])
                filtered_binaries.append(binary)
        a.binaries = filtered_binaries
        
        pyz = PYZ(a.pure)
        exe = EXE(
            pyz,
            a.scripts,
            [],
            exclude_binaries=True,
            name='${{ matrix.output_name }}',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=False,
            console=True,
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
        )
        coll = COLLECT(
            exe,
            a.binaries,
            a.datas,
            strip=False,
            upx=False,
            upx_exclude=[],
            name='clipmorph',
        )
        EOF
        fi
      shell: bash

    - name: Build with PyInstaller
      run: pyinstaller clipmorph.spec

    - name: Verify artifact contents match variant (reject misplaced web assets)
      run: |
        if [ "${{ matrix.variant }}" == "cli" ]; then
          if find dist -iname "index.html" -path "*web_assets*" | grep -q .; then
            echo "CLI artifact must not contain web assets" >&2
            exit 1
          fi
        else
          if ! find dist -iname "index.html" -path "*web_assets*" | grep -q .; then
            echo "UI artifact is missing built web assets" >&2
            exit 1
          fi
        fi
      shell: bash

    - name: Smoke test packaged executable
      run: dist/clipmorph/${{ matrix.output_name }} --help
      shell: bash

    - name: Analyze build size
      run: |
        echo "=== Build size analysis ==="
        if [ "$RUNNER_OS" == "Windows" ] || [ "$RUNNER_OS" == "macOS" ]; then
          du -sh dist/clipmorph || true
        else
          du -sh dist/clipmorph || true
        fi
        echo ""
        echo "=== Disk space after build ==="
        df -h
      shell: bash
      continue-on-error: true

    - name: Package distribution
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          7z a -tzip "${{ matrix.asset_name }}" dist/clipmorph/*
        elif [ "$RUNNER_OS" == "macOS" ]; then
          ditto -c -k --sequesterRsrc --keepParent dist/clipmorph "${{ matrix.asset_name }}"
        else
          # Linux: Create self-extracting archive
          cd dist
          tar -czf payload.tar.gz clipmorph/
          BIN_NAME="${{ matrix.output_name }}"
          ASSET_NAME="${{ matrix.asset_name }}"

          # Create self-extracting shell script
          cat > "../$ASSET_NAME" << SELFEXTRACT
        #!/bin/bash
        # Self-extracting installer for ClipMorph
        
        EXTRACT_DIR="\$HOME/.clipmorph-${{ matrix.variant }}"
        PAYLOAD_LINE=\$(awk '/^__PAYLOAD_BEGINS__/ { print NR + 1; exit 0; }' "\$0")
        
        # Extract on first run or if extraction directory doesn't exist
        if [ ! -d "\$EXTRACT_DIR" ] || [ ! -f "\$EXTRACT_DIR/clipmorph/$BIN_NAME" ]; then
            echo "Extracting ClipMorph (first run only)..."
            mkdir -p "\$EXTRACT_DIR"
            tail -n +\$PAYLOAD_LINE "\$0" | tar -xzf - -C "\$EXTRACT_DIR"
            echo "Extraction complete!"
        fi
        
        # Run the actual executable with all passed arguments
        exec "\$EXTRACT_DIR/clipmorph/$BIN_NAME" "\$@"
        
        __PAYLOAD_BEGINS__
        SELFEXTRACT
          
          # Append the compressed payload
          cat payload.tar.gz >> "../$ASSET_NAME"
          chmod +x "../$ASSET_NAME"
        fi
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.asset_name }}

  create_release:
    name: Create Release and Attach Artifacts
    runs-on: ubuntu-24.04
    needs: [release, build]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          fetch-depth: 0

      - name: Download Windows CLI artifact
        uses: actions/download-artifact@v5
        with:
          name: clipmorph-cli-windows.zip
        continue-on-error: false

      - name: Download macOS CLI artifact
        uses: actions/download-artifact@v5
        with:
          name: clipmorph-cli-macos.zip
        continue-on-error: false

      - name: Download Linux CLI artifact
        uses: actions/download-artifact@v5
        with:
          name: clipmorph-cli-linux
        continue-on-error: false

      - name: Download Windows UI artifact
        uses: actions/download-artifact@v5
        with:
          name: clipmorph-ui-windows.zip
        continue-on-error: false

      - name: Download macOS UI artifact
        uses: actions/download-artifact@v5
        with:
          name: clipmorph-ui-macos.zip
        continue-on-error: false

      - name: Download Linux UI artifact
        uses: actions/download-artifact@v5
        with:
          name: clipmorph-ui-linux
        continue-on-error: false

      - name: Verify release artifact matrix
        run: |
          set -euo pipefail
          EXPECTED=(
            clipmorph-cli-windows.zip
            clipmorph-cli-macos.zip
            clipmorph-cli-linux
            clipmorph-ui-windows.zip
            clipmorph-ui-macos.zip
            clipmorph-ui-linux
          )
          for asset in "${EXPECTED[@]}"; do
            if [ ! -e "$asset" ]; then
              echo "Missing expected release artifact: $asset" >&2
              exit 1
            fi
          done
          VERSION=$(python -c "import re; print(re.search(r'\"(.+)\"', open('clipmorph/__version__.py').read()).group(1))")
          if [ "v$VERSION" != "${{ needs.release.outputs.tag }}" ]; then
            echo "clipmorph/__version__.py ($VERSION) does not match release tag (${{ needs.release.outputs.tag }})" >&2
            exit 1
          fi
          PACKAGE_TOOL='npm'
          PUBLISH_ACTION='publish'
          if grep -RIn --include='*.yml' -E "${PACKAGE_TOOL}[[:space:]]+${PUBLISH_ACTION}|${PACKAGE_TOOL}-${PUBLISH_ACTION}" .github/workflows; then
            echo "npm must never be an end-user distribution channel" >&2
            exit 1
          fi
        shell: bash

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN && secrets.PAT_TOKEN || github.token }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          COMMIT_SHA="${{ needs.release.outputs.commit_sha }}"

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            EXISTING_COMMIT_SHA=$(git rev-list -n 1 "refs/tags/$TAG")
            if [ "$EXISTING_COMMIT_SHA" != "$COMMIT_SHA" ]; then
              echo "Tag $TAG points to $EXISTING_COMMIT_SHA, expected $COMMIT_SHA."
              exit 1
            fi
          else
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag -a "$TAG" "$COMMIT_SHA" -m "Release $TAG"
            git push origin "$TAG"
          fi

          python -m clipmorph.release_notes "$TAG" CHANGELOG.md release-notes.md

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
          else
            gh release edit "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" \
            clipmorph-cli-windows.zip \
            clipmorph-cli-macos.zip \
            clipmorph-cli-linux \
            clipmorph-ui-windows.zip \
            clipmorph-ui-macos.zip \
            clipmorph-ui-linux \
            CHANGELOG.md \
            --clobber

  publish_pypi:
    name: Publish Python package to PyPI
    needs: [release, create_release]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.commit_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build sdist and wheel (base clipmorph package only)
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/