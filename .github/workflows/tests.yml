name: Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs pull

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install web dependencies
        run: python -m pip install -e ".[web]"

      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Validate repository structure policy
        run: python scripts/check_structure.py

      - name: Run tests with coverage
        run: |
          python -m pip install coverage
          coverage run --branch -m unittest discover -s tests -v
          coverage report

      - name: Lint with ruff
        run: |
          python -m pip install ruff
          python -m ruff check --select E9,F clipmorph scripts tests quality

      - name: Type check with mypy
        run: |
          python -m pip install mypy
          python -m mypy --ignore-missing-imports clipmorph

      - name: Validate documentation health
        run: python scripts/check_docs.py

      - name: Compile package
        run: python -m compileall -q clipmorph

      - name: Validate CLI help and init paths
        run: |
          python -m clipmorph --help
          python -m clipmorph init --config-path "$RUNNER_TEMP/clipmorph.yaml"

      - name: Set execute permissions for bundled FFmpeg
        run: chmod +x clipmorph/ffmpeg/linux/ffmpeg clipmorph/ffmpeg/linux/ffprobe

      - name: CLI smoke tests (dry-run, job creation, data-dir, review gate)
        run: |
          set -euo pipefail
          DATA_DIR="$RUNNER_TEMP/cli-smoke-data"
          SAMPLE="$DATA_DIR/sources/sample.mp4"
          mkdir -p "$(dirname "$SAMPLE")"
          clipmorph/ffmpeg/linux/ffmpeg -y -f lavfi -i testsrc=duration=1:size=1920x1080:rate=10 "$SAMPLE"
          python -m clipmorph --data-dir "$DATA_DIR" init

          cat > "$RUNNER_TEMP/job.yml" <<'EOF'
          - general:
              source: sample.mp4
            conversion:
              skip: true
              subtitles:
                skip: true
          EOF

          python -m clipmorph --data-dir "$DATA_DIR" job create "$SAMPLE" \
            --job-configs "$RUNNER_TEMP/job.yml" --dry-run
          JOB_RESULT=$(python -m clipmorph --data-dir "$DATA_DIR" job create \
            "$SAMPLE" --job-configs "$RUNNER_TEMP/job.yml" --json)
          echo "$JOB_RESULT" | python -c 'import json,sys; result=json.load(sys.stdin); row=result["created"][0]; assert row["code"] == "created", row; print(row["job_id"])' > "$RUNNER_TEMP/job_id.txt"
          JOB_ID=$(cat "$RUNNER_TEMP/job_id.txt")

          python -m clipmorph --data-dir "$DATA_DIR" job get "$JOB_ID" --json > "$RUNNER_TEMP/job.json"
          python -c 'import json,pathlib; job=json.loads(pathlib.Path("'$RUNNER_TEMP'/job.json").read_text()); assert job["status"] == "created"; assert job["checkpoints"]["upload"]["status"] == "pending"'

          # `job run` without --yes and without a terminal must stop at the
          # upload review gate instead of accepting it.
          if python -m clipmorph --data-dir "$DATA_DIR" job run "$JOB_ID" \
              > "$RUNNER_TEMP/run.log" 2>&1; then
            echo "job run without --yes unexpectedly accepted the upload review gate" >&2
            exit 1
          fi
          grep -F "the review gate needs a terminal or --yes" "$RUNNER_TEMP/run.log"

          # --yes drives the pipeline to completion of the skipped stages and
          # consumes the upload gate. Upload attempts fail without runner
          # credentials, so the command may exit nonzero, but no checkpoint may
          # remain awaiting review.
          python -m clipmorph --data-dir "$DATA_DIR" job run "$JOB_ID" --yes \
            > "$RUNNER_TEMP/run-yes.log" 2>&1 || true
          python -m clipmorph --data-dir "$DATA_DIR" job get "$JOB_ID" --json > "$RUNNER_TEMP/job.json"
          python -c 'import json,pathlib; job=json.loads(pathlib.Path("'$RUNNER_TEMP'/job.json").read_text()); assert job["status"] in {"completed", "failed"}; assert all(c["status"] != "awaiting_review" for c in job["checkpoints"].values()); assert job["checkpoints"]["transcript"]["status"] == "skipped"; assert job["checkpoints"]["conversion"]["status"] == "skipped"'
        shell: bash

      - name: Verify package install
        run: |
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheel"
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/wheel/*.whl
          python -m clipmorph --help

      - name: Reject accidental npm distribution steps
        run: |
          PACKAGE_TOOL='npm'
          PUBLISH_ACTION='publish'
          if grep -RIn --include='*.yml' -E "${PACKAGE_TOOL}[[:space:]]+${PUBLISH_ACTION}|${PACKAGE_TOOL}-${PUBLISH_ACTION}" .github/workflows; then
            echo "npm must never be used as an end-user distribution channel" >&2
            exit 1
          fi
        shell: bash

  e2e:
    name: Packaged browser E2E (desktop + mobile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install web dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[web]"
          python -m pip install playwright

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run packaged browser E2E tests
        run: python -m unittest tests.test_e2e_dashboard -v
